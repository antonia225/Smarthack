name: Network detection platforms

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  network:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Deterministic tests (no scans, native network, or services)
        run: python -m pytest -q -m "not native"

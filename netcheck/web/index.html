<a class="skip" href="#main" data-i18n="skip"></a>
<div id="announcer" class="sr-only" role="status" aria-live="polite"></div>

<div class="app">
  <aside class="sidebar" aria-label="NetCheck">
    <div class="brand"><svg class="logo" aria-hidden="true"><use href="#i-logo"/></svg><span data-i18n="appName"></span></div>
    <nav class="nav" data-i18n-aria="navLabel">
      <button type="button" class="nav-item" data-page="home"><svg aria-hidden="true"><use href="#i-home"/></svg><span data-i18n="navHome"></span></button>
      <button type="button" class="nav-item" data-page="history"><svg aria-hidden="true"><use href="#i-clock"/></svg><span data-i18n="navHistory"></span></button>
      <button type="button" class="nav-item" data-page="import"><svg aria-hidden="true"><use href="#i-upload"/></svg><span data-i18n="navImport"></span></button>
    </nav>
    <div class="lang" role="radiogroup" data-i18n-aria="language">
      <button type="button" role="radio" class="lang-opt" id="lang-ro" data-lang="ro" lang="ro" aria-label="Română">RO</button>
      <button type="button" role="radio" class="lang-opt" id="lang-en" data-lang="en" lang="en" aria-label="English">EN</button>
    </div>
  </aside>

  <main id="main" class="main" tabindex="-1">
    <section id="page-home" class="page" data-page="home" aria-labelledby="home-title" hidden></section>
    <section id="page-history" class="page" data-page="history" aria-labelledby="history-title" hidden></section>
    <section id="page-import" class="page" data-page="import" aria-labelledby="import-title" hidden></section>
  </main>
</div>

<dialog id="dlg-scan" class="sheet" aria-labelledby="dlg-scan-title"></dialog>
<dialog id="dlg-clear" class="sheet" aria-labelledby="dlg-clear-title"></dialog>

<script src="texts.js"></script>
<script src="app.js"></script>
</body>
</html>

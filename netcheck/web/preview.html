<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetCheck RO | EN</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, "Segoe UI", Arial, sans-serif; font-size: 16px; background: #1c2430; }
    .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; height: 100%; padding: 12px; box-sizing: border-box; }
    .col { display: flex; flex-direction: column; min-width: 0; }
    .col h2 { margin: 0 0 8px; font-size: 16px; color: #fff; }
    iframe { flex: 1; width: 100%; border: 0; border-radius: 12px; background: #fff; }
    @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; grid-auto-rows: 90vh; height: auto; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="col"><h2 id="label-ro"></h2><iframe id="frame-ro" src="index.html?lang=ro"></iframe></div>
    <div class="col"><h2 id="label-en"></h2><iframe id="frame-en" src="index.html?lang=en"></iframe></div>
  </div>
  <script src="texts.js"></script>
  <script>
    document.getElementById("label-ro").textContent = TEXTS.ro.previewLabel;
    document.getElementById("label-en").textContent = TEXTS.en.previewLabel;
    document.getElementById("frame-ro").title = TEXTS.ro.previewLabel;
    document.getElementById("frame-en").title = TEXTS.en.previewLabel;
  </script>
</body>
</html>
